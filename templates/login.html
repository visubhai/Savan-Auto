<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Savan Travels WhatsApp Sender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#ffffff;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    @media (max-width:480px){ .card{padding:28px 22px;} }
    .bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(15,23,42,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,0.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
    .glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(234,88,12,0.10) 0%,transparent 70%);pointer-events:none;}
    .card{background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:40px;width:100%;max-width:400px;position:relative;z-index:1;box-shadow:0 10px 40px rgba(15,23,42,0.08),0 2px 6px rgba(15,23,42,0.04);}
    .logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
    .logo-icon{width:44px;height:44px;background:#ea580c;color:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 8px rgba(234,88,12,0.25);}
    .logo-text{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;color:#0f172a;line-height:1.15;}
    .logo-sub{font-size:12px;color:#64748b;font-weight:400;}
    h1{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;color:#0f172a;margin-bottom:6px;}
    p.sub{color:#64748b;font-size:14px;margin-bottom:28px;}
    label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:6px;letter-spacing:0.03em;}
    input{width:100%;background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;padding:11px 14px;color:#0f172a;font-size:14px;font-family:inherit;outline:none;transition:border-color 0.15s, box-shadow 0.15s;margin-bottom:16px;}
    input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.15);}
    input::placeholder{color:#94a3b8;}
    button{width:100%;background:#ea580c;color:#fff;font-weight:700;font-size:15px;padding:12px;border:none;border-radius:9px;cursor:pointer;font-family:inherit;transition:all 0.15s;margin-top:4px;}
    button:hover{background:#c2410c;transform:translateY(-1px);box-shadow:0 6px 18px rgba(234,88,12,0.30);}
    .error{background:#fee2e2;border:1px solid #fecaca;color:#b91c1c;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;font-weight:500;}
    .hint{text-align:center;font-size:12px;color:#94a3b8;margin-top:20px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .card{animation:fadeUp 0.4s ease both;}
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow"></div>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🚌</div>
      <div>
        <div class="logo-text">Savan Travels</div>
        <div class="logo-sub">WhatsApp Sender</div>
      </div>
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your dashboard</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="error">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}{{ '?next='+request.args.get('next') if request.args.get('next') else '' }}">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin" autofocus autocomplete="username">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" autocomplete="current-password">
      <button type="submit">Sign In →</button>
    </form>

    <div class="hint">Default: admin / savan123 — Change in Settings after first login</div>
  </div>
</body>
</html>
