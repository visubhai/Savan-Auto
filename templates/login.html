<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Savan Travels WhatsApp Sender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0e0e0e;color:#f0f0f0;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    @media (max-width:480px){ .card{padding:28px 22px;} }
    .bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
    .glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(245,158,11,0.08) 0%,transparent 70%);pointer-events:none;}
    .card{background:#181818;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:40px;width:100%;max-width:400px;position:relative;z-index:1;}
    .logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
    .logo-icon{width:44px;height:44px;background:#f59e0b;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;}
    .logo-text{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;color:#fff;line-height:1.15;}
    .logo-sub{font-size:12px;color:#666;font-weight:400;}
    h1{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;margin-bottom:6px;}
    p.sub{color:#666;font-size:14px;margin-bottom:28px;}
    label{display:block;font-size:12px;font-weight:600;color:#aaa;margin-bottom:6px;letter-spacing:0.03em;}
    input{width:100%;background:#1f1f1f;border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:11px 14px;color:#f0f0f0;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.15s;margin-bottom:16px;}
    input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,0.1);}
    button{width:100%;background:#f59e0b;color:#000;font-weight:700;font-size:15px;padding:12px;border:none;border-radius:9px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;margin-top:4px;}
    button:hover{background:#fbbf24;transform:translateY(-1px);box-shadow:0 6px 24px rgba(245,158,11,0.3);}
    .error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#f87171;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}
    .hint{text-align:center;font-size:12px;color:#444;margin-top:20px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .card{animation:fadeUp 0.4s ease both;}
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow"></div>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🚌</div>
      <div>
        <div class="logo-text">Savan Travels</div>
        <div class="logo-sub">WhatsApp Sender</div>
      </div>
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your dashboard</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="error">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}{{ '?next='+request.args.get('next') if request.args.get('next') else '' }}">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin" autofocus autocomplete="username">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" autocomplete="current-password">
      <button type="submit">Sign In →</button>
    </form>

    <div class="hint">Default: admin / savan123 — Change in Settings after first login</div>
  </div>
</body>
</html>
